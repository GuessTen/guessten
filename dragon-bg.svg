<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <g fill="none" stroke="#a9c6e8" stroke-width="1.4" opacity="0.38">
    <!-- Stylized Japanese dragon - curved body -->
    <path d="M50,300 Q80,250 60,200 Q40,150 80,120 Q110,100 100,70 Q95,50 110,40" stroke-linecap="round"/>
    <!-- Dragon head -->
    <ellipse cx="115" cy="35" rx="12" ry="8" />
    <!-- Whiskers -->
    <path d="M125,32 Q140,28 145,20" stroke-linecap="round"/>
    <path d="M125,38 Q140,42 145,50" stroke-linecap="round"/>
    <!-- Claws along body -->
    <path d="M65,220 l-8,-6 M65,220 l8,-6" stroke-linecap="round"/>
    <path d="M75,170 l-8,-6 M75,170 l8,-6" stroke-linecap="round"/>
    <!-- Cloud swirls (Japanese style) -->
    <path d="M250,100 q15,-15 30,0 q15,15 30,0" stroke-linecap="round"/>
    <path d="M250,120 q15,-15 30,0 q15,15 30,0" stroke-linecap="round"/>
    <circle cx="280" cy="85" r="3" fill="#a9c6e8" stroke="none"/>
    <!-- Small dragon scale pattern -->
    <path d="M320,250 q10,-10 20,0 q-10,10 -20,0" />
    <path d="M330,270 q10,-10 20,0 q-10,10 -20,0" />
    <path d="M320,290 q10,-10 20,0 q-10,10 -20,0" />
    <!-- Wave pattern (seigaiha inspired) -->
    <path d="M50,350 q12,-12 24,0 q12,12 24,0" stroke-linecap="round"/>
    <path d="M50,365 q12,-12 24,0 q12,12 24,0" stroke-linecap="round"/>
    <path d="M200,350 q12,-12 24,0 q12,12 24,0" stroke-linecap="round"/>
  </g>
</svg>
