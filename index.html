<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guessten</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guessten">
<link rel="apple-touch-icon" href="mascot.png">
<link rel="stylesheet" href="styles.css?v=202610170000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=202610170000"></script>
<script src="categories.js?v=202610170000"></script>
</head>
<body>
<div id="app-loader"><div class="spinner"></div><p>Loading Guessten…</p></div>

<header>
  <button id="theme-toggle" title="Toggle dark mode">🌙</button>
  <h1>Guessten</h1>
  <div id="player-badge" class="hidden"><img id="player-avatar" class="avatar-inline" alt="" /> Playing as <span id="player-name"></span> · <button id="switch-player" class="link-btn">switch</button> <button id="notify-btn" class="link-btn" title="Get notified when all scores are in">🔔</button></div>
  <div id="mascot-cloud">
    <img src="mascot.png?v=202610170000" alt="Guessten host" id="mascot" />
    <svg viewBox="0 0 200 100" class="cloud-svg" aria-hidden="true">
      <ellipse cx="60" cy="65" rx="35" ry="22" fill="#fff"/>
      <ellipse cx="100" cy="55" rx="42" ry="28" fill="#fff"/>
      <ellipse cx="140" cy="65" rx="35" ry="22" fill="#fff"/>
      <ellipse cx="80" cy="75" rx="30" ry="18" fill="#f8fafc"/>
      <ellipse cx="120" cy="75" rx="30" ry="18" fill="#f8fafc"/>
    </svg>
  </div>
  <div id="mascot-speech" class="hidden"></div>
</header>

<nav id="tabs">
  <button data-tab="play" class="active">Play</button>
  <button data-tab="today">Today</button>
  <button data-tab="season">Season</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="archive">Archive</button>
</nav>

<main>
  <!-- PLAY TAB -->
  <section id="tab-play" class="tab-panel active">
    <div id="name-picker" class="modal hidden">
      <div class="modal-box">
        <h2>Who's playing?</h2>
        <div id="name-options"></div>
        <div id="name-confirm" class="hidden">
          <p>Play as <strong id="confirm-name"></strong>?</p>
          <button id="confirm-yes" class="btn-primary">Yes</button>
          <button id="confirm-no" class="btn-secondary">No</button>
        </div>
        <div class="modal-divider">or</div>
        <button id="resume-code-btn" class="btn-secondary">Use a progress code</button>
        <div id="resume-code-entry" class="hidden">
          <input type="text" id="resume-code-input" placeholder="Paste your progress code" autocomplete="off">
          <button id="resume-code-go" class="btn-primary">Resume</button>
        </div>
      </div>
    </div>

    <div id="game-area" class="hidden">
      <div id="puzzle-meta">
        <span id="puzzle-num"></span>
        <span id="puzzle-date"></span>
      </div>
      <h2 id="category-title"></h2>
      <div id="guesses-left"></div>
      <div id="input-wrap">
        <input type="text" id="guess-input" placeholder="Type your guess…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div id="dropdown" class="hidden"></div>
      </div>
      <div id="board"></div>
      <div id="outside-top-ten"></div>
      <div id="game-controls">
        <button id="reveal-btn" class="btn-danger">Reveal answers</button>
        <button id="copy-progress-btn" class="btn-secondary">Copy progress code</button>
      </div>
      <div id="reveal-confirm" class="modal hidden">
        <div class="modal-box">
          <p>Are you sure you want to reveal the answers?</p>
          <button id="reveal-yes" class="btn-danger">Reveal</button>
          <button id="reveal-no" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <div id="finish-area" class="hidden">
      <h2 id="finish-title"></h2>
      <div id="finish-score"></div>
      <div id="finish-grid"></div>
      <div id="finish-recap"></div>
      <button id="copy-result-btn" class="btn-primary">Copy result</button>
      <button id="share-image-btn" class="btn-primary">Share image</button>
      <div id="submit-status"></div>
    </div>
  </section>

  <!-- TODAY TAB (live leaderboard) -->
  <section id="tab-today" class="tab-panel">
    <h2>Today's Scores</h2>
    <div id="live-badge"><span class="live-dot"></span> Live</div>
    <div id="today-board"><p class="muted">No scores yet today.</p></div>
  </section>

  <!-- SEASON TAB -->
  <section id="tab-season" class="tab-panel">
    <div id="rivalry-ticker" class="hidden"></div>
    <h2>Season Standings</h2>
    <div id="season-board"><p class="muted">Loading…</p></div>
    <h2>Streaks</h2>
    <div id="streaks-board"><p class="muted">Loading…</p></div>
    <h2>Past Seasons</h2>
    <div id="seasons-history"><p class="muted">Loading…</p></div>
  </section>

  <!-- ARCHIVE TAB -->
  <section id="tab-archive" class="tab-panel">
    <h2>Archive</h2>
    <input id="archive-search" type="search" placeholder="Search past puzzles…" />
    <div id="archive-list"></div>
  </section>

  <!-- STATS TAB -->
  <section id="tab-stats" class="tab-panel">
    <h2>Deep Dive Stats</h2>
    <div id="stats-player-pick"></div>
    <div id="stats-board"><p class="muted">Loading…</p></div>
  </section>
</main>

<footer>
  <div id="source-link"></div>
</footer>

<script src="supabase-client.js?v=202610170000"></script>
<script src="app.js?v=202610170000"></script>
</body>
</html>
